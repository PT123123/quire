[package]
name = "quire"
version = "0.1.0"
edition = "2021"
description = "A local, GPU-accelerated, Notion-like document app built with Rust + Slint"

[dependencies]
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Renderer is selected per cargo feature (see [features]); default-features are off so
# exactly one GPU renderer is compiled per binary, keeping the binary lean.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "accessibility",
    "system-tray",
    "image-default-formats",
    "compat-1-18",
] }

[features]
default = ["femtovg"]
# A. FemtoVG via OpenGL (Slint's default desktop renderer path)
femtovg = ["slint/renderer-femtovg"]
# A'. FemtoVG via wgpu
femtovg-wgpu = ["slint/renderer-femtovg-wgpu"]
# B. Skia (Vulkan/GL drivers behind it, per variant)
skia = ["slint/renderer-skia"]
skia-opengl = ["slint/renderer-skia-opengl"]
# Software renderer kept available as a no-GPU fallback for testing
software = ["slint/renderer-software"]

[build-dependencies]
slint-build = "1.18"

[[test]]
name = "workspace"
path = "tests/integration/workspace_test.rs"

[[test]]
name = "storage"
path = "tests/integration/storage_test.rs"

[[test]]
name = "persistence"
path = "tests/integration/persistence_test.rs"

[[test]]
name = "markdown"
path = "tests/integration/markdown_test.rs"

[[test]]
name = "search"
path = "tests/integration/search_test.rs"

# Headless screenshot tool (visual regression); built only with the
# software renderer feature so the shipped binary stays lean.
[[bin]]
name = "quire-shot"
path = "src/bin/quire_shot.rs"
required-features = ["software"]

# Scene E typing benchmark (docs/PERFORMANCE.md): drives the real window, so
# it builds against whichever renderer is enabled.
[[bin]]
name = "quire-typing"
path = "src/bin/quire_typing.rs"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
