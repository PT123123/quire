# Fetch git dependencies through the `git` CLI instead of cargo's built-in libgit2.
#
# Needed since `quire-core` became a git dependency (ADR-0094). That repository is
# public and `git ls-remote https://github.com/PT123123/quire-core.git` returns the
# ref on this machine, but the same fetch through libgit2 dies with
# `no authentication methods succeeded` — it offers credentials the anonymous URL
# never asked for, and GitHub answers the challenge with 401. Without this table a
# fresh clone of the shell cannot build, and the failure reads as a permissions
# problem rather than a client one.
[net]
git-fetch-with-cli = true

# The global download cache under $CARGO_HOME is 2.8 GB on this machine and
# nothing was ever pruning it. `auto-clean-frequency` (stabilized in Rust 1.88)
# makes cargo drop registry sources and index entries it has not touched in
# three months, on whatever build happens to cross the interval — so the
# cache stops being a thing that only grows. The ages are the cargo defaults;
# only the frequency is set here, because "never" is the default and "never" is
# the problem.
[cache]
auto-clean-frequency = "1 day"
